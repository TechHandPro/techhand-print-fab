[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "techhand-print-fab"
version = "0.2.0"
description = "Shareable MCP server for parametric 3D design, mesh export, and optional Bambu X1 Carbon print push. TNT is not required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TechHand Pro Solutions" }]
keywords = ["mcp", "3d-printing", "openscad", "cadquery"]
dependencies = ["mcp>=2.2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
techhand-print-fab = "techhand_print_fab.cli:main"

[project.urls]
Homepage = "https://github.com/TechHandPro/techhand-print-fab"
Repository = "https://github.com/TechHandPro/techhand-print-fab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
techhand_print_fab = ["py.typed", "cad_v0/*.scad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "extras/tnt/src"]
